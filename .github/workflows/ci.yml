name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and test
        run: |
          swift --version
          swift build
          swift test
