name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Build and test
        run: |
          swift --version
          swift build
          swift test
